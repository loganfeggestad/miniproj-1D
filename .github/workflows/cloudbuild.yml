steps:
  # Build the Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/catalog-repo/catalog-service:$COMMIT_SHA
      - .

  # Push the image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/catalog-repo/catalog-service:$COMMIT_SHA

  # Deploy the image to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - catalog-service
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/catalog-repo/catalog-service:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed

options:
  logging: CLOUD_LOGGING_ONLY